<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Logística · Freedom</title>
<style>
:root{--bg:#0a0c12;--card:#12151f;--card2:#0e111a;--line:#232838;--txt:#f2f4f8;--muted:#8b93a7;--faint:#5d6578;--pink:#e84b8a;--pink2:#ff7fb0;--blue:#4f7cff;--ok:#1fbf8f;--warn:#f0a53a;--track:#1b2030}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;background:var(--bg);color:var(--txt);font-family:Roboto,"Segoe UI",system-ui,sans-serif;overflow:hidden}
body{background:radial-gradient(1100px 520px at 50% 0%,rgba(232,75,138,.13) 0%,transparent 65%),var(--bg)}
.tela{height:1080px;display:flex;flex-direction:column;padding:28px 58px 18px;gap:18px}
.cab{display:flex;align-items:center;gap:38px}
.cab img{height:81px;background:#fff;border-radius:14px;padding:8px 14px}
.tit{flex:1}.tit h1{font-size:40px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.tit .sub{font-size:19px;color:var(--muted);margin-top:4px}
.hoje{text-align:right;font-size:26px;font-weight:700}.hoje small{display:block;font-size:16px;color:var(--muted);font-weight:600;letter-spacing:.04em;margin-top:2px}
.main{flex:1;min-height:0;overflow:hidden;display:grid;grid-template-columns:1.45fr 1fr;gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 36px;display:flex;flex-direction:column;min-height:0}
.lbl{font-size:17px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.hero{font-size:168px;font-weight:800;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums;margin:8px 0 6px;white-space:nowrap}
.hero .rs{font-size:.34em;color:var(--pink);font-weight:700;margin-right:.18em;vertical-align:.7em}
.heroSub{font-size:20px;color:var(--muted)}
.chip{display:inline-block;font-size:17px;font-weight:700;padding:7px 18px;border-radius:999px;background:rgba(232,75,138,.15);color:var(--pink2);border:1px solid rgba(232,75,138,.35);margin-right:10px}
.sep{height:1px;background:var(--line);margin:30px 0 26px}
.outros{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tile{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;gap:6px}
.tile span{font-size:17px;color:var(--muted)}.tile b{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums}.tile small{font-size:15px;color:var(--faint)}
.total{margin-top:auto;display:flex;justify-content:space-between;align-items:center;background:rgba(232,75,138,.09);border:1px solid rgba(232,75,138,.35);border-radius:14px;padding:26px 30px}
.total span{font-size:20px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--pink2)}
.total b{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums}
.falta{font-size:170px;font-weight:800;line-height:1;margin:10px 0 0;font-variant-numeric:tabular-nums;color:var(--warn)}
.faltaSub{font-size:22px;color:var(--muted);margin-top:4px}
.barra{position:relative;height:18px;border-radius:99px;background:var(--track);margin:18px 0 8px;overflow:hidden;display:flex}
.barra i{display:block;height:100%}
.leg{display:flex;justify-content:space-between;font-size:17px;color:var(--muted);font-variant-numeric:tabular-nums}
.lista{margin-top:14px;display:flex;flex-direction:column}
.l{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(35,40,56,.7);font-size:22px}
.l span{color:var(--muted)}.l b{font-weight:800;font-variant-numeric:tabular-nums}
.l .pt{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:12px}
.l.nao span,.l.nao b{color:var(--faint)}
.acum{margin-top:auto;display:flex;justify-content:space-between;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:16px 22px;font-size:19px;color:var(--muted)}
.acum b{font-size:34px;color:var(--txt);font-variant-numeric:tabular-nums}
.rod{display:flex;justify-content:space-between;font-size:15px;color:var(--faint)}
.ex{background:rgba(240,165,58,.12);border:1px solid rgba(240,165,58,.4);color:var(--warn);font-size:15px;font-weight:700;text-align:center;padding:6px;border-radius:10px;letter-spacing:.04em}

html,body{width:100%;height:100%}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.dias{display:flex;align-items:center;gap:16px;font-size:14px;color:var(--faint)}
.dias .dl{white-space:nowrap}
#chips{display:flex;flex-wrap:wrap;gap:8px}
.cp{font:inherit;font-size:14px;font-weight:700;color:var(--muted);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-variant-numeric:tabular-nums}
.cp b{color:var(--txt);margin-left:4px}
.cp.hj{border-color:rgba(232,75,138,.5);color:var(--pink2)}
.cp:hover{border-color:var(--pink)}
#fundo{position:absolute;inset:0;background:rgba(5,6,10,.72);display:none;align-items:center;justify-content:center;z-index:5}
#fundo.on{display:flex}
#caixa{width:1240px;max-height:880px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 34px;display:flex;flex-direction:column}
#caixa .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#caixa h3{font-size:30px;font-weight:800}
#caixa .sub{font-size:17px;color:var(--muted);margin-bottom:16px}
#fechar{font:inherit;font-size:17px;font-weight:700;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 18px;cursor:pointer}
.tb{overflow:auto;min-height:0}
.r{display:grid;grid-template-columns:130px 1fr 170px 270px;gap:18px;padding:11px 4px;border-bottom:1px solid rgba(35,40,56,.7);font-size:19px;font-variant-numeric:tabular-nums;align-items:center}
.r.h{font-size:14px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;font-weight:700;position:sticky;top:0;background:var(--card)}
.r .v{text-align:right}
.st{display:inline-block;font-size:15px;font-weight:700;padding:4px 12px;border-radius:999px}
.st.a{background:rgba(240,165,58,.14);color:var(--warn)}.st.b{background:rgba(79,124,255,.14);color:#8fa9ff}.st.c{background:rgba(232,75,138,.14);color:var(--pink2)}

.gsub{font-size:17px;color:var(--muted);margin:6px 0 20px}
#quad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-content:start}
.q{font:inherit;color:var(--txt);text-align:left;cursor:pointer;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:2px;aspect-ratio:1.25/1;justify-content:space-between}
.q .d{font-size:22px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.q .n{font-size:64px;font-weight:800;line-height:1;color:var(--warn);font-variant-numeric:tabular-nums}
.q .t{font-size:15px;color:var(--faint)}
.q.hj{border-color:rgba(232,75,138,.6);background:rgba(232,75,138,.08)}
.q.hj .d{color:var(--pink2)}
.q:hover{border-color:var(--pink)}

.main{display:flex !important;flex-direction:column;gap:18px}
.vendas{flex:1;display:grid;grid-template-columns:1.25fr 1fr;gap:44px;align-items:center}
.vendas .hero{font-size:150px;margin:10px 0 12px}
.vendas .tile b{font-size:30px}
.vendas .tile{padding:16px 18px}
.vendas .total{margin-top:16px;padding:20px 26px}
.vendas .total b{font-size:48px}
.vendas .total span{font-size:18px}
.abertos{padding:20px 28px 22px}
.abertos .gsub{display:inline;margin:0 0 0 6px;font-size:15px;letter-spacing:0;text-transform:none;font-weight:400;color:var(--faint)}
#quad{display:grid !important;grid-template-columns:repeat(auto-fill,minmax(150px,1fr)) !important;gap:12px;margin-top:14px}
.q{aspect-ratio:auto !important;padding:14px 18px !important;gap:0 !important}
.q .n{font-size:56px !important}
.q .d{font-size:19px !important}

.erro{color:var(--warn)}
</style></head><body><div id="stage"><div class="tela">
 <div class="cab"><img src="logo.png" alt="Freedom"><div class="tit"><h1>Logística · Faturamento do dia</h1><div class="sub" id="sub">carregando…</div></div>
  <div class="hoje" id="hoje">—</div></div>
 <div class="main">
  <div class="card vendas">
   <div class="esq"><div class="lbl">Vendas faturadas hoje</div><div class="hero" id="vendas"><span class="rs">R$</span>—</div></div>
   <div class="dir"><div class="lbl" style="margin-bottom:12px">Demais operações</div><div class="outros" id="outros"></div>
    <div class="total"><span>Total faturado do dia</span><b id="total">—</b></div></div>
  </div>
  <div class="card abertos"><div class="lbl">Pedidos em aberto por dia</div><div id="quad"></div></div>
 </div>
 <div class="rod"><span class="erro" id="msg"></span><span>Freedom · Logística</span></div>
</div>
<div id="fundo"><div id="caixa"><div class="top"><h3 id="mt"></h3><button id="fechar" type="button">Fechar ✕</button></div><div class="sub" id="ms"></div><div class="tb" id="mb"></div></div></div>
</div>
<script src="config.js?v=3"></script>
<script src="login.js"></script>
<script>
const EXEMPLO=/[?&]exemplo\b/.test(location.search);
const $=id=>document.getElementById(id);
const brl=n=>'R$ '+Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const SEM=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dm=iso=>iso.slice(8,10)+'/'+iso.slice(5,7);
const SIT={sem_registro:['a','Sem registro de conferência'],em_conferencia:['b','Em conferência'],conferido_nao_faturado:['c','Conferido, não faturado']};
let D=null, DIAS=[];

function exemploDados(){
  const hoje=new Date().toISOString().slice(0,10), cli=['AUTO POSTO EXEMPLO LTDA','COMERCIAL MODELO SA','DISTRIBUIDORA ALFA ME','MERCADO CENTRAL LTDA'];
  const mk=(dia,n,b)=>({dia,pedidos:Array.from({length:n},(_,k)=>({pedido:b+k*3,cliente:cli[k%4],valor:300+((k*911)%8000),situacao:k%5===3?'conferido_nao_faturado':'sem_registro'}))});
  return {atualizado_em:new Date().toISOString(),periodo:{hoje},
    faturado:{vendas:187430.5,outros:[{nome:'Comodato',valor:12800,notas:4},{nome:'Bonificação',valor:4250.9,notas:3},{nome:'Outros',valor:1120,notas:1}],total:205601.4},
    abertos:[mk('2026-10-31',4,121625),mk('2026-11-03',9,122100),mk('2026-11-04',8,122500),mk(hoje,58,123400)]};
}

function mostrar(){
  const d=D, [y,m,dd]=d.periodo.hoje.split('-').map(Number), dt=new Date(y,m-1,dd);
  $('hoje').innerHTML=esc(SEM[dt.getDay()][0].toUpperCase()+SEM[dt.getDay()].slice(1))+', '+dd+' de '+MES[m-1]+'<small>'+String(dd).padStart(2,'0')+'/'+String(m).padStart(2,'0')+'/'+y+'</small>';
  const h=d.atualizado_em?new Date(d.atualizado_em):null;
  $('sub').textContent='Notas fiscais emitidas hoje'+(h&&!isNaN(h)?' · atualizado às '+h.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'');
  $('vendas').innerHTML='<span class="rs">R$</span>'+esc(brl(d.faturado.vendas).slice(3));
  $('outros').innerHTML=(d.faturado.outros||[]).map(o=>'<div class="tile"><span>'+esc(o.nome)+'</span><b>'+esc(brl(o.valor))+'</b>'+(o.notas!=null?'<small>'+o.notas+(o.notas===1?' nota':' notas')+'</small>':'')+'</div>').join('');
  $('outros').style.gridTemplateColumns='repeat('+Math.max(1,Math.min(3,(d.faturado.outros||[]).length))+',1fr)';
  $('total').textContent=brl(d.faturado.total);
  DIAS=(d.abertos||[]).slice().sort((a,b)=>a.dia<b.dia?-1:1);
  if(!DIAS.some(x=>x.dia===d.periodo.hoje)) DIAS.push({dia:d.periodo.hoje,pedidos:[]});
  const q=$('quad'); q.innerHTML='';
  DIAS.forEach((x,i)=>{const n=x.pedidos.length,hj=x.dia===d.periodo.hoje,b=document.createElement('button');
    b.type='button';b.className='q'+(hj?' hj':'');
    b.innerHTML='<span class="d">'+dm(x.dia)+(hj?' · hoje':'')+'</span><span class="n">'+n+'</span><span class="t">'+(n===1?'pedido':'pedidos')+'</span>';
    b.onclick=()=>abrir(i);q.appendChild(b);});
}
function abrir(i){
  const x=DIAS[i],L=x.pedidos,tot=L.reduce((a,p)=>a+Number(p.valor||0),0);
  $('mt').textContent='Pedidos em aberto · '+dm(x.dia);
  $('ms').textContent=L.length+' pedido(s) sem nota fiscal e sem motivo · '+brl(tot);
  $('mb').innerHTML='<div class="r h"><div>Pedido</div><div>Cliente</div><div class="v">Valor</div><div>Situação</div></div>'+
    L.map(p=>{const s=SIT[p.situacao]||['a',p.situacao||'—'];return '<div class="r"><div>'+esc(p.pedido)+'</div><div>'+esc(p.cliente)+'</div><div class="v">'+esc(brl(p.valor))+'</div><div><span class="st '+s[0]+'">'+esc(s[1])+'</span></div></div>';}).join('');
  $('fundo').classList.add('on');
}
$('fechar').onclick=()=>$('fundo').classList.remove('on');
$('fundo').addEventListener('click',e=>{if(e.target===$('fundo'))$('fundo').classList.remove('on');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('fundo').classList.remove('on');});

async function carregar(){
  try{ const j=EXEMPLO?exemploDados():await TV.buscar('logistica',carregar);
    if(!j||!j.faturado||!j.periodo||!Array.isArray(j.abertos)) throw new Error('a função chamada ('+String(window.FUNCAO_URL||'sem endereço').split('/').pop()+') não devolve o formato da logística. Confira o config.js (deve terminar em tvlogistica).');
    D=j; mostrar(); $('msg').textContent=EXEMPLO?'dados de exemplo':''; }
  catch(e){ $('msg').textContent='Não consegui atualizar: '+(e&&e.message||e); }
}
const stage=$('stage');
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform='scale('+k+')';stage.style.left=((innerWidth-1920*k)/2)+'px';stage.style.top=((innerHeight-1080*k)/2)+'px';}
addEventListener('resize',fit);fit();
carregar(); setInterval(carregar,120000);
</script></body></html>
